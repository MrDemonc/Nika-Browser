[package]
name = "nika-browser"
version = "0.1.0"
edition = "2024"
authors = ["demonc"]
description = "Navegador web moderno, minimalista y seguro en Rust con WebKit, bloqueo de rastreadores y tema oscuro refinado."

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
webkit6 = "0.6"
glib = "0.22"
gio = "0.22"
url = "2.5"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.11.1"
sha2 = "0.11.1"
pbkdf2 = "0.13.0"
rand = "0.10.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
