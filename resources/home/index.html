<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <style>
    /* Modo Oscuro Negro Puro y Grises Neutros (Predeterminado permanente) */
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --card-border: #242424;
      --text-main: #F0F0F0;
      --text-muted: #888888;
      --accent-lavender: #C0C0C0;
      --accent-mint: #A8A8A8;
      --accent-peach: #B8B8B8;
      --accent-sky: #9C9C9C;
      --accent-pink: #BFBFBF;
      --shield-bg: #181818;
      --shield-text: #CCCCCC;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.95);
      --input-bg: #111111;
    }

    .brand-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }

    .brand-logo {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: transform 0.25s ease;
    }

    .brand-logo:hover {
      transform: scale(1.05);
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    body.dark {
      --bg: #000000;
      --card-bg: #121212;
      --card-border: #242424;
      --text-main: #F0F0F0;
      --text-muted: #888888;
      --accent-lavender: #C0C0C0;
      --accent-mint: #A8A8A8;
      --accent-peach: #B8B8B8;
      --accent-sky: #9C9C9C;
      --accent-pink: #BFBFBF;
      --shield-bg: #181818;
      --shield-text: #CCCCCC;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.95);
      --input-bg: #111111;
    }

    body.dark .search-input:focus {
      border-color: #666666;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
    }

    body.dark .quick-link-card {
      background: #141414;
      border-color: #242424;
      color: #E0E0E0;
    }

    body.dark .quick-link-card:hover {
      background: #202020;
      border-color: #444444;
      transform: translateY(-2px);
    }

    body.dark .quick-link-icon {
      background-color: #242424 !important;
      color: #F0F0F0 !important;
      border: 1px solid #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 620px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
    }

    .clock {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: -1px;
      color: var(--text-main);
      margin-bottom: 0.15rem;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .clock:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }

    .search-box {
      width: 100%;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.8rem 1.4rem 0.8rem 2.8rem;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
      box-shadow: var(--shadow);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-input:focus {
      border-color: var(--accent-lavender);
      box-shadow: 0 6px 20px rgba(192, 132, 252, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.55;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      width: 100%;
    }

    .quick-link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      text-decoration: none;
      color: var(--text-main);
      padding: 0.65rem 0.95rem;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: all 0.16s ease;
      min-width: 80px;
      box-shadow: var(--shadow);
    }

    .quick-link-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-lavender);
    }

    .quick-link-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .quick-link-title {
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* Pastel badges */
    .bg-red      { background-color: #FF8A8A; color: #1A1A1A; }
    .bg-lavender { background-color: var(--accent-lavender); color: #1A1A1A; }
    .bg-mint     { background-color: var(--accent-mint); color: #1A1A1A; }
    .bg-peach    { background-color: var(--accent-peach); color: #1A1A1A; }
    .bg-sky      { background-color: var(--accent-sky); color: #1A1A1A; }
  </style>
</head>

        <h1 class="brand-title">Nika Browser</h1>
      </div>
      <div class="clock" id="clock" title="Haz clic para alternar entre formato 12h y 24h">12:00</div>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="search-input" placeholder="Buscar o ingresa una URL..." autofocus>
    </div>

    <div class="quick-links">
      <a href="https://www.youtube.com" class="quick-link-card">
        <div class="quick-link-icon bg-red">▶️</div>
        <span class="quick-link-title">YouTube</span>
      </a>
      <a href="https://github.com" class="quick-link-card">
        <div class="quick-link-icon bg-mint">🐙</div>
        <span class="quick-link-title">GitHub</span>
      </a>
      <a href="https://wikipedia.org" class="quick-link-card">
        <div class="quick-link-icon bg-sky">📖</div>
        <span class="quick-link-title">Wikipedia</span>
      </a>
      <a href="https://reddit.com" class="quick-link-card">
        <div class="quick-link-icon bg-peach">🤖</div>
        <span class="quick-link-title">Reddit</span>
      </a>
      <a href="https://archlinux.org" class="quick-link-card">
        <div class="quick-link-icon bg-lavender">🏹</div>
        <span class="quick-link-title">Arch Linux</span>
      </a>
    </div>
  </div>

  <script>
    /* __INITIAL_SETTINGS__ */

    // Sincronizar tema según parámetro URL o almacenamiento
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('theme') === 'dark') {
      document.body.classList.add('dark');
    } else if (urlParams.get('theme') === 'light') {
      document.body.classList.remove('dark');
    }

    // Configuración de formato de hora (12h o 24h)
    let currentSettings = window.__NIKA_SETTINGS || {};
    let timeFormat = currentSettings.time_format || localStorage.getItem('nika_time_format') || '24h';

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('clock');
      if (!clockEl) return;

      if (timeFormat === '12h') {
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // Formato 12 horas: 0 es 12
        clockEl.textContent = `${hours}:${minutes} ${ampm}`;
      } else {
        const hoursStr = String(hours).padStart(2, '0');
        clockEl.textContent = `${hoursStr}:${minutes}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Alternar formato de hora haciendo clic en el reloj
    const clockEl = document.getElementById('clock');
    if (clockEl) {
      clockEl.addEventListener('click', () => {
        timeFormat = timeFormat === '12h' ? '24h' : '12h';
        localStorage.setItem('nika_time_format', timeFormat);
        currentSettings.time_format = timeFormat;
        updateClock();

        if (window.nikaSend) {
          window.nikaSend("nikaSaveSettings", JSON.stringify(currentSettings));
        }
      });
    }

    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      setTimeout(() => searchInput.focus(), 30);
      setTimeout(() => searchInput.focus(), 150);
      window.addEventListener('load', () => searchInput.focus());
      window.addEventListener('focus', () => searchInput.focus());
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) searchInput.focus();
      });
      document.addEventListener('keydown', (e) => {
        if (document.activeElement !== searchInput && !e.ctrlKey && !e.altKey && !e.metaKey && e.key.length === 1) {
          searchInput.focus();
        }
      });
    }
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        if (!query) return;
        if (query.startsWith('http://') || query.startsWith('https://')) {
          window.location.href = query;
        } else if (query.includes('.') && !query.includes(' ')) {
          window.location.href = 'https://' + query;
        } else {
          // Búsqueda limpia con Google
          window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query) + '&pws=0';
        }
      }
    });
  </script>
